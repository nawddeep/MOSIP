version: '3.8'

services:
  face-liveness-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mosip-face-liveness
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=8000
