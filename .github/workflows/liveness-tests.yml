name: Face liveness tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android-liveness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.10.4'

      # android/local.properties (flutter.sdk) is written by the Flutter tool and is gitignored,
      # and settings.gradle needs it.
      - name: Flutter pub get
        run: flutter pub get

      # android/gradlew and gradle-wrapper.jar are gitignored (Flutter generates them on build),
      # so Gradle is provided here. Version matches gradle-wrapper.properties.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      # The ubuntu-latest runner image ships the Android SDK (ANDROID_HOME).
      - name: Liveness and MiniFASNet unit tests
        working-directory: android
        run: gradle --no-daemon :livenessmanager:testDebugUnitTest :minifasnet:test

  flutter-liveness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.10.4'

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter liveness tests
        run: flutter test test/face_liveness

  desktop-liveness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Desktop core module tests
        working-directory: desktop/registration
        run: mvn -B -pl registration-liveness-core -am test

      - name: Desktop liveness and audit tests
        working-directory: desktop/registration
        run: >
          mvn -B -pl registration-services -am test
          -Dtest='io.mosip.registration.liveness.*Test,AuditManagerDescriptionOverloadTest'
          -DfailIfNoTests=false
